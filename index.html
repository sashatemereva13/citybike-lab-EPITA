<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An educational operations dashboard for a bicycle-sharing service.">
  <title>CityBike Service Status</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <p class="eyebrow">CITYBIKE / SERVICE OPERATIONS</p>
      <h1>CityBike Service Dashboard</h1>
      <p>Reliable releases start with shared visibility.</p>
    </header>
    <section id="service-list" aria-label="Current service status">
      <h2>Service status</h2>
      <div class="card"><strong>Bike rentals</strong><span class="ok">Operational</span></div>
      <div class="card"><strong>Station availability</strong><span class="ok">Operational</span></div>
      <div class="card"><strong>Account login</strong><span class="ok">Operational</span></div>
    </section>
    <section id="updates" aria-label="Latest update">
      <h2>Latest update</h2>
      <p id="latest-update">Last checked: training environment.</p>
    </section>
  </main>
</body>
</html>
